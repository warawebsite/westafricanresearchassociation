<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="{{ page.description | default: site.description | escape }}"><title>{% if page.title %}{{ page.title | escape }} — {% endif %}WARA</title><link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}"><script src="{{ '/assets/js/site.js' | relative_url }}" defer></script><link rel="stylesheet" href="{{ '/assets/css/wara-home-original.css' | relative_url }}">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "/assets/css/wara-layout-fix.css" | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/wara-mission-page.css' | relative_url }}">

<link rel="stylesheet" href="{{ '/assets/css/wara-board-page.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/wara-about-page.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/wara-staff-page.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/wara-partner-page.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/wara-chiwara-page.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/wara-global-tools.css' | relative_url }}">
</head><body>{% include header.html %}<main id="content">{{ content }}</main>

<!-- WARA GLOBAL TRANSLATION AND SOCIAL LINKS -->
<section class="wara-global-tools" aria-label="Language and social media">

  <div class="wara-global-language">
    <p class="wara-global-language-title">
      Explore WARA in your language
    </p>

    <div class="wara-language-options" aria-label="Choose a language">
      <a href="#" data-wara-lang="en" aria-label="English">
        <span aria-hidden="true">🇺🇸</span>
        <span>English</span>
      </a>

      <a href="#" data-wara-lang="fr" aria-label="Français">
        <span aria-hidden="true">🇫🇷</span>
        <span>Français</span>
      </a>

      <a href="#" data-wara-lang="pt" aria-label="Português">
        <span aria-hidden="true">🇵🇹</span>
        <span>Português</span>
      </a>
    </div>

    <p class="wara-language-note">
      Translations open in a new tab.
    </p>
  </div>

  <nav class="wara-social-bar" aria-label="Follow WARA">
    <a href="https://twitter.com/west_wara"
       target="_blank" rel="noopener noreferrer"
       aria-label="WARA on X">𝕏</a>

    <a href="https://www.facebook.com/west.african.research.association/"
       target="_blank" rel="noopener noreferrer"
       aria-label="WARA on Facebook">f</a>

    <a href="https://www.youtube.com/channel/UC1sqLyfshzln_CVtebdWCxg"
       target="_blank" rel="noopener noreferrer"
       aria-label="WARA on YouTube">▶</a>

    <a href="https://www.instagram.com/warawarc"
       target="_blank" rel="noopener noreferrer"
       aria-label="WARA on Instagram">◎</a>
  </nav>

</section>
<!-- END WARA GLOBAL TOOLS -->
{% include footer.html %}






<script src="{{ '/assets/js/wara-global-tools.js' | relative_url }}" defer></script>
</body></html>
